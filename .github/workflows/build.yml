name: Build APK

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    # Просто принимаем лицензии у уже установленного SDK
    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # Создаем файл с путями
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > EzhAndroid/local.properties

    - name: Build with Gradle
      run: |
        cd EzhAndroid
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: EzhAndroid/app/build/outputs/apk/debug/app-debug.apk
