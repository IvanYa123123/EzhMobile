name: Build APK

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    # СКАЧИВАЕМ БИБЛИОТЕКИ ДЛЯ ОФЛАЙН-РЕЖИМА
    - name: Download offline assets
      run: |
        mkdir -p EzhAndroid/app/src/main/python/static/vendor
        curl -sL -o EzhAndroid/app/src/main/python/static/vendor/bootstrap.min.css https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css
        curl -sL -o EzhAndroid/app/src/main/python/static/vendor/bootstrap.bundle.min.js https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js
        curl -sL -o EzhAndroid/app/src/main/python/static/vendor/chart.umd.min.js https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > EzhAndroid/local.properties

    - name: Build with Gradle
      run: |
        cd EzhAndroid
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: EzhAndroid/app/build/outputs/apk/debug/app-debug.apk
