name: Build APK

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ОБЯЗАТЕЛЬНО ДЛЯ CHAQUOPY: Устанавливаем Python 3.11 на сервер
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Более надежный способ настройки Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > EzhAndroid/local.properties

    - name: Build with Gradle
      run: |
        cd EzhAndroid
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: EzhAndroid/app/build/outputs/apk/debug/app-debug.apk
