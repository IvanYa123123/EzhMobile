name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Fetch vendor assets
        run: python scripts/fetch_vendor_assets.py

      - name: Verify vendor assets (MUST EXIST)
        run: |
          echo "Проверка скачанных файлов..."
          ls -la EzhAndroid/app/src/main/python/static/vendor/
          ls -la EzhAndroid/app/src/main/python/static/fonts/
          if [ ! -f "EzhAndroid/app/src/main/python/static/vendor/bootstrap.bundle.min.js" ]; then
            echo "ОШИБКА: bootstrap.bundle.min.js не найден!"
            exit 1
          fi
          echo "Все файлы на месте."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет KEYSTORE_BASE64. См. BUILD.md, раздел 4.1."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: EzhAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
