name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: jsdom smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download vendor assets
        run: node scripts/fetch_vendor_assets.mjs
      - name: Install JS test dependencies
        working-directory: tests/js
        run: npm ci --no-audit --no-fund
      - name: UI smoke tests
        working-directory: tests/js
        run: node --test ui.test.mjs
