name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Backend tests
        run: python -m pytest -q

  ui:
    name: jsdom smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Download vendor assets
        run: python scripts/fetch_vendor_assets.py
      - name: Install JS test dependencies
        working-directory: tests/js
        run: npm ci --no-audit --no-fund
      - name: UI smoke tests
        working-directory: tests/js
        run: node --test ui.test.mjs
