# Размер кучи для Gradle-демона: Chaquopy гоняет pip + компиляцию байткода,
# дефолтных 512 МБ не хватает.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX обязателен: appcompat, material, core, activity.
android.useAndroidX=true

# Jetifier не нужен — старых support-библиотек в проекте нет.
android.enableJetifier=false

# R-классы только из своего модуля.
android.nonTransitiveRClass=true

