// build.gradle (корневой) — только объявление версий плагинов.
// Chaquopy 17.2.0 — актуальная стабильная ветка:
//   • Python 3.10 … 3.15
//   • Android Gradle Plugin 7.3 … 9.4
//   • minSdk >= 24
// AGP 8.13.0 — последняя стабильная ветка 8.x: без breaking changes AGP 9,
// проверенная связка с Chaquopy, требует JDK 17 и Gradle 8.13.
//
// Kotlin-плагин здесь НЕ нужен: в проекте нет ни одного .kt/.kts файла,
// весь нативный код — Java. Лишний classpath только увеличивает время
// конфигурации и риск конфликта версий.

plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.chaquo.python'       version '17.2.0' apply false
}
