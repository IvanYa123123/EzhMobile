// JVM-ядро бэкенда. Здесь будет Ktor-сервер, планировщик СевГУ, Jsoup-парсеры,
// Moodle, ICS и SQL. Модуль не зависит от Android API, поэтому тесты идут
// на обычной JVM: `./gradlew :core:test`.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// jvmToolchain(17) требовал бы установленный JDK 17; на CI он есть,
// но локально удобнее собирать тем же JDK, что запускает Gradle.
// Поэтому фиксируем только target байткода (17 — как у :app).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}
