// Модуль приложения «Ежедневник СевГУ».
//
// Ключевые моменты:
//   • namespace/applicationId = com.ezh.diary — совпадает с package в Java-коде
//     и с android:name=".EzhApplication" в AndroidManifest.xml.
//   • minSdk 26 — потому что иконка лаунчера есть ТОЛЬКО в mipmap-anydpi-v26
//     (adaptive-icon). На API 24–25 ресурс @mipmap/ic_launcher не разрешится.
//   • targetSdk 34 — осознанно. Начиная с targetSdk 35 Android 15 принудительно
//     включает edge-to-edge, а MainActivity не умеет WindowInsets: WebView
//     и сплэш уехали бы под статус-бар, а adjustResize перестал бы работать.
//     compileSdk при этом свежий (36) — можно пользоваться новыми API.
//   • vendor-ассеты (bootstrap/chart/inter) проверяются до сборки:
//     без них index.html получает 404 и renderCalendar() не вызывается.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// versionName берётся из assets/VERSION (файл кладётся в APK как есть).
def ezhVersionName = '0.8'
def versionFile = file('src/main/assets/VERSION')
if (versionFile.exists()) {
    def raw = versionFile.text.trim()
    if (raw) ezhVersionName = raw
}

// versionCode можно переопределить извне: CI передаёт номер прогона, поэтому
// каждый APK получает большую версию и устанавливается поверх предыдущего.
def ezhVersionCode = (findProperty('appVersionCode') ?: '8').toString().toInteger()

// Release-подпись берётся из переменных окружения (CI раскладывает keystore
// из секрета KEYSTORE_BASE64 во временный файл). Локально, без этих
// переменных, release собирается неподписанным.
def ezhKeystoreFile = System.getenv('KEYSTORE_FILE')
def ezhHasKeystore = ezhKeystoreFile != null && new File(ezhKeystoreFile).exists()

android {
    namespace 'com.ezh.diary'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ezh.diary'
        minSdk 26
        targetSdk 34
        versionCode ezhVersionCode
        versionName ezhVersionName
        // В APK попадают переводы только этих языков: библиотеки тянут
        // десятки локалей в resources.arsc, хотя приложение русское.
        resourceConfigurations += ['ru', 'en']
    }

    signingConfigs {
        if (ezhHasKeystore) {
            release {
                storeFile file(ezhKeystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ezhHasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // MainActivity берёт версию из BuildConfig.VERSION_NAME для User-Agent.
    // В AGP 8.x генерация BuildConfig по умолчанию выключена (`cannot find
    // symbol: class BuildConfig`), поэтому включаем её явно.
    buildFeatures {
        buildConfig = true
    }

    lint {
        // assembleDebug/Release lint не запускают, но `./gradlew build` — да.
        // Не валим сборку на косметике (например, на отсутствии PNG-иконок
        // для API 24–25, которые отсечены minSdk 26).
        abortOnError false
        checkReleaseBuilds false
    }
}

// ============================================================
//  ГЕЙТ ПЕРЕД СБОРКОЙ: vendor-ассеты обязаны существовать
// ------------------------------------------------------------
//  Статика лежит в assets/static. Если
//  static/vendor/bootstrap.min.css отсутствует, сервер отдаёт 404,
//  window.bootstrap === undefined, первый же new bootstrap.Modal()
//  бросает ReferenceError, и календарь остаётся пустым. Дешевле
//  упасть на сборке, чем ловить белый экран на устройстве.
// ============================================================

def vendorAssets = [
    'src/main/assets/static/vendor/bootstrap.min.css',
    'src/main/assets/static/vendor/bootstrap.bundle.min.js',
    'src/main/assets/static/vendor/chart.umd.min.js',
    'src/main/assets/static/fonts/inter-variable.woff2',
    'src/main/assets/static/js/app.bundle.js',
]

// index.html подключает один app.bundle.js вместо 30 модулей.
// Пакет пересобирается на каждой сборке APK (нужен Node 20+).
tasks.register('buildJsBundle') {
    group = 'build'
    description = 'Собирает assets/static/js/app.bundle.js из модулей интерфейса.'
    doLast {
        def script = new File(rootProject.projectDir, 'scripts/build_js_bundle.mjs')
        exec {
            commandLine 'node', script.absolutePath
            workingDir rootProject.projectDir
        }
    }
}

tasks.register('checkVendorAssets') {
    group = 'verification'
    description = 'Проверяет наличие vendor-ассетов до сборки APK.'
    dependsOn 'buildJsBundle'
    doLast {
        def missing = vendorAssets.findAll { !file(it).exists() }
        if (!missing.isEmpty()) {
            throw new org.gradle.api.GradleException(
                'Отсутствуют vendor-ассеты:\n  ' + missing.join('\n  ') +
                '\n\nВыполните из корня репозитория:\n' +
                '  node scripts/fetch_vendor_assets.mjs\n' +
                'и повторите сборку.'
            )
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'checkVendorAssets'
}

// ============================================================
//  ЗАВИСИМОСТИ
// ============================================================

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Kotlin-бэкенд: Ktor, планировщик, Moodle, преподаватели, SQLite-слой.
    implementation project(':core')

    // Theme.MaterialComponents.DayNight.NoActionBar из values/themes.xml
    implementation 'com.google.android.material:material:1.12.0'

    // AppCompatActivity, AppCompatDelegate
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // NotificationCompat, NotificationManagerCompat, ActivityCompat
    implementation 'androidx.core:core:1.13.1'

    // OnBackPressedCallback, registerForActivityResult, ActivityResultContracts
    implementation 'androidx.activity:activity:1.9.3'
}
