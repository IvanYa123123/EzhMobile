<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <title>Ежедневник СевГУ</title>

    <script nonce="{{ csp_nonce }}">
    (function () {
        try {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
            if (t === 'custom') {
                var raw = localStorage.getItem('customTheme');
                if (raw) {
                    var d = JSON.parse(raw);
                    if (d && d.colors) {
                        for (var k in d.colors) {
                            document.documentElement.style.setProperty(k, d.colors[k]);
                        }
                    }
                }
            }
        } catch (e) {}
    })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css?v={{ app_version }}" rel="stylesheet">
    <link href="/static/css/fixes.css?v={{ app_version }}" rel="stylesheet">
    <link href="/static/css/hedgehog.css?v={{ app_version }}" rel="stylesheet">
    <link href="/static/css/mobile.css?v={{ app_version }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-mobile-tab="schedule">

<div id="updateNotification" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11000; display: none;">
    <div class="bg-success text-white px-4 py-2 rounded shadow-sm fw-bold d-flex align-items-center gap-2" style="opacity: 0.95;">
        <span style="font-size: 1.2em;">🔄</span>
        <span id="updateNotificationText">Расписание обновлено</span>
    </div>
</div>

<div id="undoBar" style="display: none;">
    <span id="undoBarText">Заметка удалена</span>
    <button type="button" id="undoBarBtn">Отменить</button>
</div>

<div id="globalLoader" style="display: none;">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <div id="loaderText" class="mt-3 fw-bold text-secondary fs-5">Загрузка...</div>
</div>

<!-- КОМПАКТНАЯ ШАПКА (Для мобильных, если группа выбрана) -->
<div id="compactHeader" class="d-md-none d-none bg-white border-bottom shadow-sm px-3 py-2 d-flex align-items-center justify-content-between" style="position: sticky; top: 0; z-index: 1050;">
    <div class="d-flex align-items-center gap-2">
        <span style="font-size: 1.5rem;">🦔</span>
        <span class="fw-bold text-primary" id="compactGroupName" style="font-size: 1.1rem;">Группа</span>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-light btn-sm rounded-circle p-2" onclick="manualRefresh()" title="Обновить">
            <span style="font-size: 1.1rem;">🔄</span>
        </button>
        <button class="btn btn-light btn-sm rounded-circle p-2" onclick="openSettingsModal()" title="Настройки">
            <span style="font-size: 1.1rem;">⚙️</span>
        </button>
    </div>
</div>

<div class="container-fluid p-3">
    <!-- ОГРОМНАЯ ШАПКА (Скрывается после первого запуска) -->
    <div class="controls-header bg-white p-2 rounded shadow-sm border mb-3" id="onboardingHeader">
        <div class="row align-items-center g-2">
            <div class="col-md-2 col-6">
                <h5 class="mb-0 fw-bold d-flex align-items-center brand-title" style="color: var(--accent); letter-spacing: -0.5px;">
                    <span id="ezh-logo" style="font-size: 2.2rem; line-height: 0.5; margin-right: 0px; margin-left: -5px; display: inline-block;">🦔</span>
                    <span>дневник</span>
                </h5>
            </div>
            <div class="col-md-3 col-6">
                <div class="input-group input-group-sm">
                    <input type="text" id="groupSelect" class="form-control" placeholder="Группа..." autocomplete="off">
                    <button class="btn btn-primary" onclick="fetchSemesterData()">Найти</button>
                </div>
            </div>
            <div class="col-md-2 col-12">
                <select id="subgroupSelect" class="form-select form-select-sm" onchange="fetchSemesterData()">
                    <option value="0">Все подгруппы</option>
                    <option value="1">1 подгруппа</option>
                    <option value="2">2 подгруппа</option>
                </select>
            </div>
            <div class="col-md-5 col-12 d-flex align-items-center justify-content-end gap-2 flex-wrap">
                <button class="btn btn-outline-secondary btn-sm fw-bold shadow-sm header-icon-btn d-none d-md-inline-flex" onclick="openSearchModal()">🔍</button>
                <button class="btn btn-outline-secondary btn-sm fw-bold shadow-sm header-icon-btn d-none d-md-inline-flex" onclick="manualRefresh()">🔄</button>
                <button class="btn btn-outline-secondary btn-sm fw-bold shadow-sm header-icon-btn d-none d-md-inline-flex" onclick="openSettingsModal()">⚙️</button>
                <button class="btn btn-outline-primary btn-sm fw-bold shadow-sm d-none d-md-inline-flex" onclick="goToToday()">Сегодня</button>
                <div class="dropdown d-none d-md-block">
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle fw-bold shadow-sm" type="button" id="weekDropdownBtn" data-bs-toggle="dropdown">📅 Неделя</button>
                    <ul class="dropdown-menu scrollable-weeks shadow-sm border" id="weekDropdownMenu"></ul>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-12 text-start small schedule-status" id="scheduleStatus"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-9 col-lg-8 mb-4 main-column">
            <div class="d-flex flex-column w-100">
                <div class="calendar-nav-row">
                    <div class="nav-side"><button class="nav-arrow" onclick="navigatePrev()">&#10094;</button></div>
                    <div class="calendar-grid flex-grow-1" id="calendar"></div>
                    <div class="nav-side"><button class="nav-arrow" onclick="navigateNext()">&#10095;</button></div>
                </div>

                <div id="mainColumnSections">
                    <div id="friendsSection" data-draggable-section>
                        <div class="mt-4 d-flex align-items-center justify-content-between mb-2 bg-white p-2 rounded shadow-sm border">
                            <span class="fw-bold fs-6">👥 Друзья</span>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary fw-bold" onclick="showAddFriendModal()">+</button>
                                <div class="dropdown d-flex align-items-center">
                                    <button class="btn btn-sm btn-primary text-white dropdown-toggle fw-bold shadow-sm" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">👁</button>
                                    <ul class="dropdown-menu shadow-sm border-0 dropdown-menu-end" id="friendTogglesDropdown" style="min-width: 250px;"></ul>
                                </div>
                            </div>
                        </div>
                        <div id="friendsCalendarsContainer" class="d-flex flex-column gap-3 mb-4"></div>
                    </div>

                    <div id="teachersSection" data-draggable-section>
                        <div class="mt-4 d-flex align-items-center justify-content-between mb-2 bg-white p-2 rounded shadow-sm border">
                            <span class="fw-bold fs-6">🎓 Преподаватели</span>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary fw-bold" onclick="showAddTeacherModal()">+</button>
                                <div class="dropdown d-flex align-items-center">
                                    <button class="btn btn-sm btn-primary text-white dropdown-toggle fw-bold shadow-sm" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">👁</button>
                                    <ul class="dropdown-menu shadow-sm border-0 dropdown-menu-end" id="teacherTogglesDropdown" style="min-width: 250px;"></ul>
                                </div>
                            </div>
                        </div>
                        <div id="teachersCalendarsContainer" class="d-flex flex-column gap-3 mb-4"></div>
                    </div>
                </div>
                <div id="underCalendarWidgetsZone"></div>
            </div>
        </div>

        <div class="col-xl-3 col-lg-4 sidebar-column">
            <div id="rightWidgetsZone" class="sticky-top d-flex flex-column gap-3" style="top: 15px;">
                <!-- Виджеты (как в оригинале) -->
                <div class="widget-card" id="widgetMiniCalCard" data-draggable-widget>
                    <div class="widget-header">
                        <h6 class="widget-title">📅 <span id="miniCalendarTitle">—</span></h6>
                        <div class="widget-header-actions">
                            <button class="btn btn-sm btn-light py-0 px-2 fw-bold" onclick="miniCalPrevMonth()">‹</button>
                            <button class="btn btn-sm btn-light py-0 px-2 fw-bold" onclick="miniCalToday()">•</button>
                            <button class="btn btn-sm btn-light py-0 px-2 fw-bold" onclick="miniCalNextMonth()">›</button>
                        </div>
                    </div>
                    <div class="mini-cal-body-row">
                        <div id="miniCalendarBody" class="mini-calendar"></div>
                        <div class="mini-cal-events" id="miniCalEvents"></div>
                    </div>
                </div>

                <div class="widget-card" id="widgetGlobalCard" data-draggable-widget>
                    <div class="widget-header"><h6 class="widget-title" onclick="showStats()">Остаток пар</h6></div>
                    <div class="widget-body-row">
                        <div class="widget-canvas-wrap" onclick="showStats()"><canvas id="globalStatsChart"></canvas></div>
                        <div class="widget-details-wrap" id="globalStatsDetails"></div>
                    </div>
                </div>

                <div class="widget-card" id="widgetLabsCard" data-draggable-widget>
                    <div class="widget-header"><h6 class="widget-title" onclick="showLabs()">Лабораторные</h6></div>
                    <div class="widget-body-row">
                        <div class="widget-canvas-wrap" onclick="showLabs()"><canvas id="labStatsChart"></canvas></div>
                        <div class="widget-details-wrap" id="labStatsDetails"></div>
                    </div>
                </div>

                <div class="widget-card" id="widgetPacingCard" data-draggable-widget>
                    <div class="widget-header"><h6 class="widget-title">Темп сдачи лаб</h6></div>
                    <div id="labPacingBody" style="max-height: 340px; overflow-y: auto;">
                        <div id="labPacingContent"></div>
                    </div>
                </div>

                <div class="widget-card" id="widgetNotesCard" data-draggable-widget>
                    <div class="widget-header"><h6 class="widget-title">📝 Заметки</h6></div>
                    <textarea id="notesWidgetText" class="form-control form-control-sm" placeholder="Что-нибудь важное..." oninput="onNotesWidgetInput(this)"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалки (все те же, что и были) -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 560px;">
    <div class="modal-content border-0 shadow settings-modal">
      <div class="modal-header py-3">
        <h5 class="modal-title fw-bold d-flex align-items-center gap-2 mb-0"><span style="font-size: 1.2em;">⚙️</span><span>Настройки</span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <!-- (Тут весь код настроек из оригинального index.html) -->
      </div>
    </div>
  </div>
</div>

<nav class="mobile-bottom-nav d-md-none" id="mobileBottomNav">
    <button type="button" class="mobile-nav-item active" data-tab="schedule" onclick="switchMobileTab('schedule')">
        <span class="nav-icon">📅</span><span>Расписание</span>
    </button>
    <button type="button" class="mobile-nav-item" data-tab="people" onclick="switchMobileTab('people')">
        <span class="nav-icon">👥</span><span>Люди</span>
    </button>
    <button type="button" class="mobile-nav-item" data-tab="widgets" onclick="switchMobileTab('widgets')">
        <span class="nav-icon">📊</span><span>Виджеты</span>
    </button>
    <button type="button" class="mobile-nav-item" onclick="openSettingsModal()">
        <span class="nav-icon">⚙️</span><span>Настройки</span>
    </button>
</nav>

<!-- (Здесь подключены все остальные скрипты из твоего оригинального index.html) -->

<script src="/static/js/calendar.js?v={{ app_version }}"></script>
<script src="/static/js/navigation.js?v={{ app_version }}"></script>
<script src="/static/js/status.js?v={{ app_version }}"></script>
<script src="/static/js/tasks.js?v={{ app_version }}"></script>

<script src="/static/js/widgets.js?v={{ app_version }}"></script>
<script src="/static/js/search.js?v={{ app_version }}"></script>

<script src="/static/js/custom-theme.js?v={{ app_version }}"></script>
<script src="/static/js/main.js?v={{ app_version }}"></script>
<script src="/static/js/settings.js?v={{ app_version }}"></script>
<script src="/static/js/notifications.js?v={{ app_version }}"></script>
<script src="/static/js/hotkeys.js?v={{ app_version }}"></script>
<script src="/static/js/teachers.js?v={{ app_version }}"></script>
<script src="/static/js/mobile.js?v={{ app_version }}"></script>
</body>
</html>
