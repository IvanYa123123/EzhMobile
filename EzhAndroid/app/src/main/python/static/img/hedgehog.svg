<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .hh-body    { fill: var(--hh-body, #f5d9a8); }
      .hh-shade   { fill: var(--hh-body-shade, #dcb87c); }
      .hh-quill   { fill: var(--hh-quills, #6b3f1a); }
      .hh-dark    { fill: var(--hh-dark, #1f2937); }
      .hh-stroke  { stroke: var(--hh-stroke, #2a1505); stroke-width: 1.5; fill: none; }
      .hh-leg     { animation: hh-leg 0.5s infinite alternate ease-in-out; transform-origin: center; }
      .hh-leg-2   { animation-delay: 0.25s; }
      @keyframes hh-leg {
        from { transform: translateY(0); }
        to   { transform: translateY(-1.5px); }
      }
    </style>
  </defs>
  <!-- Иголки -->
  <path class="hh-quill"
        d="M28 52 L34 30 L42 50 L50 26 L58 48 L66 28 L74 50 L80 34 L84 54 Z"
        stroke="var(--hh-stroke, #2a1505)" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Тело -->
  <path class="hh-body"
        d="M22 66 Q22 48 42 48 L72 48 Q86 48 86 66 Q86 84 54 84 Q22 84 22 66 Z"
        stroke="var(--hh-stroke, #2a1505)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Нос -->
  <path class="hh-body"
        d="M22 66 Q14 66 14 70 Q14 76 22 76 Z"
        stroke="var(--hh-stroke, #2a1505)" stroke-width="1.5" stroke-linejoin="round"/>
  <circle class="hh-dark" cx="15" cy="70" r="1.6"/>
  <!-- Глаз -->
  <circle class="hh-dark" cx="36" cy="62" r="2.2"/>
  <!-- Лапки -->
  <ellipse class="hh-shade hh-leg"   cx="38" cy="84" rx="5" ry="3"/>
  <ellipse class="hh-shade hh-leg hh-leg-2" cx="60" cy="84" rx="5" ry="3"/>
</svg>
